name: Repair marketing release dependency lockfile

# Temporary, branch-restricted repair. No audit bypass and no deployment.
on:
  push:
    branches:
      - feat/cobest-marketing-color-release
    paths:
      - .github/workflows/repair-marketing-deps.yml

permissions:
  contents: write

jobs:
  patch-vite-vitest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Update known vulnerable development dependencies
        run: |
          npm install --save-dev --save-exact vite@6.4.5 vitest@4.1.12
          npm audit --audit-level=high
          node -e "const p=require('./package.json'); if(p.devDependencies.vite!=='6.4.5'||p.devDependencies.vitest!=='4.1.12')process.exit(1)"
      - name: Commit reviewed dependency bump to release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile change required"
          else
            git commit -m "fix(security): update vulnerable Vite and Vitest dev dependencies"
            git push origin HEAD:feat/cobest-marketing-color-release
          fi
