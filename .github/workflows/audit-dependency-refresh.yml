name: Audit dependency refresh

on:
  push:
    branches: [qa/full-functional-audit]

permissions:
  contents: write

jobs:
  refresh:
    if: "!contains(github.event.head_commit.message, '[dependency-refresh]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/full-functional-audit
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --save-dev --save-exact vitest@4.1.11
      - run: npm audit fix
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh patched test dependencies [dependency-refresh]"
          git push origin HEAD:qa/full-functional-audit
