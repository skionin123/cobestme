name: Normalize marketing release npm10 lockfile
on:
  push:
    branches:
      - feat/cobest-marketing-color-release
    paths:
      - .github/workflows/normalize-marketing-lock.yml
permissions:
  contents: write
jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate with production-compatible npm 10
        run: |
          npm --version
          npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          npm ci --no-fund
          npm audit --audit-level=high
      - name: Record verified package-lock repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(security): normalize patched lockfile for npm10 ci"
            git push origin HEAD:feat/cobest-marketing-color-release
          fi
