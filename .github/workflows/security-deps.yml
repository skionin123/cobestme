name: Dependency security sync

on:
  push:
    branches: [qa/stabilization-batch]
    paths:
      - security.locktrigger

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/stabilization-batch
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply non-breaking audit fixes
        run: npm audit fix --package-lock-only || true
      - name: Commit lockfile fixes
        run: |
          git config user.name "cobest-ci"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Apply dependency security lockfile fixes"
            git push origin HEAD:qa/stabilization-batch
          fi
      - name: Require no high or critical advisories
        run: npm audit --audit-level=high
