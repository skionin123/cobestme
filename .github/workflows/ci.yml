name: CoBest CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node --check server.mjs
      - run: node --check server-payment-safety.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - name: Start server
        run: |
          npm run start > /tmp/cobest-server.log 2>&1 &
          echo $! > /tmp/cobest-server.pid
          sleep 2
      - name: Smoke health endpoint
        run: |
          curl --fail --silent http://127.0.0.1:4173/api/health | tee /tmp/health.json
          grep '"ok":true' /tmp/health.json
      - name: Smoke SPA fallback
        run: curl --fail --silent http://127.0.0.1:4173/some-client-route | grep '<div id="root"></div>'
      - name: Dependency security gate (must pass to release)
        run: npm audit --audit-level=high
      - name: Diagnose server startup on failure
        if: failure()
        run: |
          echo "Server startup logs:"
          cat /tmp/cobest-server.log 2>/dev/null || true
      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/cobest-server.pid ]; then kill "$(cat /tmp/cobest-server.pid)" || true; fi
