name: Bootstrap MVP browser tests

on:
  push:
    branches: [mvp/core-builder-stabilization]

permissions:
  contents: write

jobs:
  bootstrap:
    if: "!contains(github.event.head_commit.message, '[pw-bootstrap]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mvp/core-builder-stabilization
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --save-dev --save-exact @playwright/test@1.64.0
      - run: npm pkg set scripts.test:e2e="playwright test"
      - run: npm audit --audit-level=high
      - name: Commit dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: add Playwright browser test dependency [pw-bootstrap]"
          git push origin HEAD:mvp/core-builder-stabilization
