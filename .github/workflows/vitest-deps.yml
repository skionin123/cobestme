name: Test dependency sync

on:
  push:
    branches: [qa/stabilization-batch]
    paths:
      - vitest.locktrigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/stabilization-batch
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --save-dev --save-exact vitest@3.2.4
      - name: Commit lockfile
        run: |
          git config user.name "cobest-ci"
          git config user.email "actions@users.noreply.github.com"
          node -e "const fs=require('fs');const p=require('./package.json');p.scripts.test='vitest run';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          npm install --package-lock-only
          git add package.json package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Vitest test runner"
          git push origin HEAD:qa/stabilization-batch
