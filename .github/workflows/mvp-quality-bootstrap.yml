name: MVP quality bootstrap

on:
  push:
    branches: [mvp/core-builder-stabilization]

permissions:
  contents: write

jobs:
  bootstrap:
    if: "!contains(github.event.head_commit.message, '[quality-bootstrap]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mvp/core-builder-stabilization
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --save-dev --save-exact typescript@latest @types/react@18 @types/react-dom@18 eslint@latest typescript-eslint@latest
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit quality toolchain
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: add MVP quality toolchain [quality-bootstrap]"
          git push origin HEAD:mvp/core-builder-stabilization
